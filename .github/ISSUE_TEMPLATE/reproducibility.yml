name: Reproducibility issue
description: Report a documented command, environment, or artifact that cannot be reproduced.
title: "[Reproducibility]: "
body:
  - type: input
    id: artifact
    attributes:
      label: Artifact or claim
      description: Name the file, command, table, or documented claim.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and setup
      description: Include environment creation and the command that failed.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: Paste a redacted error or explain how your output differs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit and Python version
      placeholder: "commit abc1234; CPython 3.12.8"
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction check
      options:
        - label: Logs contain no credentials, private paths, restricted data, or exact archaeological coordinates.
          required: true

