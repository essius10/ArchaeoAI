name: Documentation improvement
description: Suggest a research-documentation improvement or report unclear, outdated, inaccessible, or incorrect text.
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: "Do not post archaeological coordinates, candidate locations, private terrain, private paths, credentials, or restricted data."
  - type: input
    id: location
    attributes:
      label: Document location
      description: Link the file and heading or line.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Proposed wording is welcome but not required.
  - type: checkboxes
    id: claims
    attributes:
      label: Safety and claim check
      options:
        - label: The suggestion does not add unverified model, discovery, or performance claims.
          required: true
        - label: I removed sensitive locations, private data and paths, and credentials.
          required: true
